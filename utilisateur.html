<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenStore — Mon espace</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{background:#020617;color:#e2e8f0}.panel{background:rgba(15,23,42,.88);border:1px solid #334155;border-radius:1rem}.muted{color:#94a3b8}input,select{background:#020617;border:1px solid #475569;border-radius:.65rem;padding:.7rem;width:100%;color:#f8fafc}button,.btn{border-radius:.7rem;padding:.7rem 1rem;font-weight:600}.primary{background:#4f46e5}.secondary{background:#1e293b}.notice{padding:.8rem;border-radius:.7rem;background:#172554;color:#c7d2fe}.error{background:#4c0519;color:#fecdd3}.success{background:#064e3b;color:#a7f3d0}a{color:#a5b4fc}</style></head><body class="min-h-screen"><header class="border-b border-slate-800 p-4"><div class="max-w-3xl mx-auto flex justify-between items-center"><a href="index.html" class="font-bold text-xl">◈ OpenStore</a><button id="logout" class="secondary">Déconnexion</button></div></header><main class="max-w-3xl mx-auto p-4 md:p-8 space-y-5"><h1 class="text-3xl font-bold">Mon espace</h1><div id="status" class="notice">Chargement du compte…</div><section class="panel p-5 space-y-3"><h2 class="text-xl font-bold">Mon compte</h2><p><span class="muted">Adresse :</span> <span id="email">—</span></p><p><span class="muted">Rôle :</span> <strong id="role">—</strong></p><p class="muted text-sm">Les fonctionnalités affichées dépendent du rôle attribué à ton compte OpenStore.</p><div id="developerActions" hidden class="pt-2"><a class="btn primary inline-block" href="developpeur.html">Ouvrir l’espace développeur</a></div><div id="adminActions" hidden class="pt-2"><a class="btn secondary inline-block" href="admin.html">Administration</a></div></section><a href="index.html">← Retour au catalogue</a></main><script type="module">import {requireRole,logout,canDevelopRole,isAdminRole} from './firebase-shared.js';const $=id=>document.getElementById(id);$('logout').onclick=()=>logout();try{const {user,role}=await new Promise((resolve,reject)=>{import('./firebase-shared.js').then(async m=>{try{resolve(await m.requireRole(['ami','invité','invite','testeur','codeur','programmeur','admin','administrateur']))}catch(e){reject(e)}})});$('email').textContent=user.email;$('role').textContent=role;$('developerActions').hidden=!canDevelopRole(role);$('adminActions').hidden=!isAdminRole(role);$('status').className='success';$('status').textContent='Compte connecté.';}catch(e){$('status').className='error';$('status').textContent=e.message;}if(window.lucide)window.lucide.createIcons();</script></body></html>
