<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenStore — Administration</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{background:#020617;color:#e2e8f0}.panel{background:rgba(15,23,42,.88);border:1px solid #334155;border-radius:1rem}.muted{color:#94a3b8}input,select{background:#020617;border:1px solid #475569;border-radius:.65rem;padding:.7rem;width:100%;color:#f8fafc}button,.btn{border-radius:.7rem;padding:.7rem 1rem;font-weight:600}.primary{background:#4f46e5}.secondary{background:#1e293b}.notice{padding:.8rem;border-radius:.7rem;background:#172554;color:#c7d2fe}.error{background:#4c0519;color:#fecdd3}.success{background:#064e3b;color:#a7f3d0}a{color:#a5b4fc}</style></head><body class="min-h-screen"><header class="border-b border-slate-800 p-4"><div class="max-w-3xl mx-auto"><a href="index.html" class="font-bold text-xl">◈ OpenStore</a></div></header><main class="max-w-3xl mx-auto p-4 md:p-8 space-y-5"><h1 class="text-3xl font-bold">Administration</h1><div id="status" class="notice">Vérification…</div><section id="adminPanel" hidden class="panel p-5 space-y-3"><h2 class="text-xl font-bold">Raccourcis administrateur</h2><p class="muted">La gestion existante des applications et des comptes reste dans la page d’accueil OpenStore. Cette page est un point d’entrée protégé.</p><a href="index.html" class="btn primary inline-block">Retour à OpenStore</a><a href="developpeur.html" class="btn secondary inline-block">Espace développeur</a></section></main><script type="module">import {requireRole,logout} from './firebase-shared.js';const $=id=>document.getElementById(id);try{const {user}=await requireRole(['admin','administrateur']);$('status').className='success';$('status').textContent='Administrateur connecté : '+user.email;$('adminPanel').hidden=false;}catch(e){$('status').className='error';$('status').textContent=e.message;}if(window.lucide)window.lucide.createIcons();</script></body></html>
